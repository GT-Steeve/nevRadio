<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NevRadio</title>
  <link rel="stylesheet" href="asset/css/style.css">
  <link rel="icon" type="image/x-icon" href="asset/img/faviconM.png">
</head>
<body>

  <div id="app">

    <!-- ══ Panneau gauche ══ -->
    <div id="left-panel">

      <!-- Pochette -->
      <div id="art-box">
        <span id="art-icon">♪</span>
        <!-- Contrôles de lecture -->
        <div id="playback-controls">
          <button id="btn-prev"    title="Piste précédente" aria-label="Piste précédente">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.3 3.5 3.3 12l13 8.5z"/></svg>
          </button>
          <div id="mode-buttons">
            <button id="btn-shuffle" title="Lecture aléatoire" aria-label="Lecture aléatoire" aria-pressed="false">
              <svg class="icon icon-mystery" viewBox="0 0 24 24" aria-hidden="true">
                <path class="mystery-q" d="M8 8.2a4 4 0 1 1 5.6 3.7c-1.1.5-1.6 1.3-1.6 2.5v1"/>
                <circle class="mystery-dot" cx="12" cy="19.6" r="1.5"/>
                <path class="star-mini star-1" d="M19.6 1.4c0.25 1.77 1.23 2.75 3 3c-1.77 0.25 -2.75 1.23 -3 3c-0.25 -1.77 -1.23 -2.75 -3 -3c1.77 -0.25 2.75 -1.23 3 -3z"/>
                <path class="star-mini star-2" d="M4.2 13.5c0.17 1.18 0.82 1.83 2 2c-1.18 0.17 -1.83 0.82 -2 2c-0.17 -1.18 -0.82 -1.83 -2 -2c1.18 -0.17 1.83 -0.82 2 -2z"/>
              </svg>
              <span class="btn-stars" aria-hidden="true">
                <svg class="bstar" viewBox="0 0 24 24" style="left:20%;top:30%;width:9px;--dur:2.5s;--delay:0.3s"><path d="M12 0.5c0.97 6.78 4.71 10.53 11.5 11.5c-6.78 0.97 -10.53 4.71 -11.5 11.5c-0.97 -6.78 -4.71 -10.53 -11.5 -11.5c6.78 -0.97 10.53 -4.71 11.5 -11.5z"/></svg>
                <svg class="bstar" viewBox="0 0 24 24" style="left:31%;top:19%;width:5px;--dur:2.1s;--delay:1.3s"><path d="M12 0.5c0.97 6.78 4.71 10.53 11.5 11.5c-6.78 0.97 -10.53 4.71 -11.5 11.5c-0.97 -6.78 -4.71 -10.53 -11.5 -11.5c6.78 -0.97 10.53 -4.71 11.5 -11.5z"/></svg>
                <svg class="bstar" viewBox="0 0 24 24" style="left:84%;top:74%;width:11px;--dur:2.2s;--delay:0.9s"><path d="M12 0.5c0.97 6.78 4.71 10.53 11.5 11.5c-6.78 0.97 -10.53 4.71 -11.5 11.5c-0.97 -6.78 -4.71 -10.53 -11.5 -11.5c6.78 -0.97 10.53 -4.71 11.5 -11.5z"/></svg>
                <svg class="bstar" viewBox="0 0 24 24" style="left:16%;top:80%;width:7px;--dur:1.9s;--delay:1.5s"><path d="M12 0.5c0.97 6.78 4.71 10.53 11.5 11.5c-6.78 0.97 -10.53 4.71 -11.5 11.5c-0.97 -6.78 -4.71 -10.53 -11.5 -11.5c6.78 -0.97 10.53 -4.71 11.5 -11.5z"/></svg>
              </span>
            </button>
            <button id="btn-loop"    title="Boucle" aria-label="Boucle" aria-pressed="false">
              <svg class="icon icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M17.5 3.5v4h-4"/></svg>
            </button>
          </div>
          <button id="btn-next"    title="Piste suivante" aria-label="Piste suivante">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.7 3.5 20.7 12l-13 8.5z"/></svg>
          </button>
        </div>
        <div id="yt-controls-bar">
          <span id="yt-time"></span>
        </div>
      </div>

      <!-- Bande colorée : ouvre le sélecteur de catégorie -->
      <div id="art-label">
        <button id="category-btn" type="button" aria-haspopup="dialog" aria-controls="category-modal">
          <span id="category-btn-label">Sélectionner une catégorie</span>
        </button>
      </div>

      <!-- Liste des pistes -->
      <div id="track-list"></div>

      <div id="version-tag"></div>

    </div>

    <!-- ══ Panneau droit ══ -->
    <div id="right-panel">

      <!-- Lecteur vidéo YouTube / SoundCloud -->
      <div id="video-container">
        <!-- Volume (SoundCloud uniquement) -->
        <div id="sc-controls">
          <button id="vol-down" title="Baisser le volume">−</button>
          <button id="vol-mute" title="Muet / Son">🔊</button>
          <button id="vol-up"   title="Monter le volume">+</button>
        </div>

        <div id="yt-player-wrap">
          <div id="yt-player"></div>
        </div>
        <iframe id="sc-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>

    </div>

  </div>

  <!-- ══ Sélecteur de catégorie (cartes) ══ -->
  <div id="category-modal" hidden>
    <div id="category-panel" role="dialog" aria-modal="true" aria-labelledby="category-modal-title">
      <div id="category-header">
        <h2 id="category-modal-title">Sélectionner une catégorie</h2>
        <div id="category-view" role="group" aria-label="Mode d'affichage">
          <button type="button" data-view="image" title="Affichage par images">▦ Images</button>
          <button type="button" data-view="text"  title="Affichage par texte">☰ Texte</button>
        </div>
        <button id="category-close" type="button" title="Fermer" aria-label="Fermer">✕</button>
      </div>
      <input id="category-search" type="search" placeholder="Rechercher…" autocomplete="off">
      <div id="category-grid"></div>
      <p id="category-empty" hidden>Aucune catégorie trouvée</p>
    </div>
  </div>

  <script src="asset/js/app.js"></script>
</body>
</html>
