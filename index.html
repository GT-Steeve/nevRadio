<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NevRadio</title>
  <link rel="stylesheet" href="asset/css/style.css">
  <link rel="icon" type="image/x-icon" href="asset/img/faviconM.png">
</head>
<body>

  <div id="app">

    <!-- ══ Panneau gauche ══ -->
    <div id="left-panel">

      <!-- Pochette -->
      <div id="art-box">
        <span id="art-icon">♪</span>
        <!-- Contrôles de lecture -->
        <div id="playback-controls">
          <button id="btn-prev"    title="Piste précédente">◀</button>
          <div id="mode-buttons">
            <button id="btn-shuffle" title="Lecture aléatoire">✧</button>
            <button id="btn-loop"    title="Boucle">↻</button>
          </div>
          <button id="btn-next"    title="Piste suivante">▶</button>
        </div>
        <div id="yt-controls-bar">
          <span id="yt-time"></span>
        </div>
      </div>

      <!-- Bande colorée : sélecteur de catégorie intégré -->
      <div id="art-label">
        <select id="category-select">
          <option value="">— NevRadio —</option>
        </select>
      </div>

      <!-- Liste des pistes -->
      <div id="track-list"></div>

    </div>

    <!-- ══ Panneau droit ══ -->
    <div id="right-panel">


      <!-- Lecteur vidéo YouTube / SoundCloud -->
      <div id="video-container">
        <!-- Volume (SoundCloud uniquement) -->
        <div id="sc-controls">
          <button id="vol-down" title="Baisser le volume">−</button>
          <button id="vol-mute" title="Muet / Son">🔊</button>
          <button id="vol-up"   title="Monter le volume">+</button>
        </div>

        <div id="yt-player-wrap">
          <div id="yt-player"></div>
        </div>
        <iframe id="sc-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>

    </div>

  </div>

  <script src="asset/js/app.js"></script>
</body>
</html>
