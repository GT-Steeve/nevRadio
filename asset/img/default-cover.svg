    <circle cx="200" cy="200" r="150" stroke-width="3"/>
    <circle cx="200" cy="200" r="115" stroke-width="3"/>
    <circle cx="200" cy="200" r="80"  stroke-width="3"/>
  </g>
  <!-- Note de musique -->
