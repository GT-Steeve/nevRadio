      <stop offset="0" stop-color="#14143a"/>
      <stop offset="1" stop-color="#1e1e52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#7dd3fc"/>
